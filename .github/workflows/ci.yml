name: CI — GraphAccount Pro

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  testes:
    name: Testes e Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ruff
          pip install customtkinter pillow openpyxl pandas pdfplumber python-dotenv PyYAML SQLAlchemy

      - name: Lint com Ruff
        run: |
          ruff check Src/ tests/ --output-format=github

      - name: Rodar testes
        run: |
          pytest tests/ -v --tb=short --cov=Src --cov-report=term-missing

      - name: Resumo de cobertura
        if: always()
        run: |
          echo "## Resultado dos Testes" >> $GITHUB_STEP_SUMMARY
          pytest tests/ --tb=no -q 2>&1 | tail -5 >> $GITHUB_STEP_SUMMARY || true
